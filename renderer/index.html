<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http:" />
  <title>U1 Farm Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../assets/icon.png" alt="" />
      <div>
        <h1>U1 Farm Control</h1>
        <span class="sub" data-i18n="app.subtitle"></span>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnSettings" data-i18n="btn.settings"></button>
    </div>
  </header>

  <section id="empty" class="empty" hidden>
    <img src="../assets/icon.png" alt="" />
    <h2 data-i18n="empty.title"></h2>
    <p data-i18n-html="empty.text"></p>
    <button class="btn primary" id="emptyAdd" data-i18n="add.printer"></button>
  </section>
  <main id="grid" class="grid"></main>

  <!-- Ayarlar -->
  <dialog id="settings">
    <form method="dialog" class="dlg">
      <h2 data-i18n="set.title"></h2>
      <div id="printerRows"></div>
      <button type="button" class="btn ghost small" id="addPrinter" data-i18n="add.printer"></button>
      <hr />
      <label class="field"><span data-i18n="set.language"></span><select id="optLang" class="input"></select></label>
      <label class="check"><input type="checkbox" id="optTrayPer" /> <span data-i18n="set.trayPer"></span></label>
      <label class="check"><input type="checkbox" id="optNotif" /> <span data-i18n="set.notif"></span></label>
      <label class="check"><input type="checkbox" id="optAutostart" /> <span data-i18n="set.autostart"></span></label>
      <label class="check"><input type="checkbox" id="optStartMin" /> <span data-i18n="set.startMin"></span></label>
      <div class="dlg-actions">
        <button class="btn ghost" value="cancel" data-i18n="cancel"></button>
        <button class="btn primary" id="saveSettings" value="ok" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Onay -->
  <dialog id="confirm">
    <form method="dialog" class="dlg small">
      <h2 id="confirmTitle" data-i18n="cf.sure"></h2>
      <p id="confirmText"></p>
      <div class="dlg-actions">
        <button class="btn ghost" value="no" data-i18n="cancel"></button>
        <button class="btn danger" value="yes" data-i18n="cf.yes"></button>
      </div>
    </form>
  </dialog>

  <!-- Dosyalar / geçmiş -->
  <dialog id="files">
    <div class="dlg wide">
      <div class="dlg-head"><h2 id="filesTitle" data-i18n="files.tab"></h2><button class="btn ghost small" id="filesClose">✕</button></div>
      <div class="tabs"><button class="tab active" data-tab="files" data-i18n="files.tab"></button><button class="tab" data-tab="history" data-i18n="files.history"></button></div>
      <input id="fileSearch" class="input" data-i18n-ph="files.search" />
      <div id="filesList" class="files-list"></div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <canvas id="trayCanvas" width="32" height="32" hidden></canvas>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
